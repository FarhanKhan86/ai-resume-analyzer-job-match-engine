[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-resume-analyzer-job-match-engine"
version = "0.1.0"
description = "Explainable local resume and job-description matching MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "streamlit>=1.38",
  "requests>=2.32"
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
